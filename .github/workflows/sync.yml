name: Hourly Google Sheets sync

on:
  schedule:
    # Every hour, minute 30, hours 2-14 UTC = ~7:30am-7:30pm IST.
    - cron: "30 2-14 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_URL }}"
