name: Hourly Google Sheets sync (manual)

# The `schedule` trigger was removed 2026-08-27 — GitHub Actions' own docs
# acknowledge scheduled workflows "can be delayed... in some cases may not
# run" during high load, and ours confirmed that in practice (stopped firing
# for 12+ hours despite being correctly configured). cron-job.org is now the
# actual hourly trigger; this workflow stays for manual runs via the Actions
# tab (or `gh workflow run`) when you want to sync on demand.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync
        run: |
          # /api/sync now responds immediately (202) and keeps the actual
          # sync running in the background via Next.js's after() — a single
          # call is enough, no retry needed for a slow response.
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_URL }}"
