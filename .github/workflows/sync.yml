name: Hourly Google Sheets sync

on:
  schedule:
    # Every hour, minute 30, hours 2-14 UTC = 8:00am-8:00pm IST, Mon-Sat
    # (day-of-week 1-6; GitHub Actions cron runs in UTC, and this window
    # never crosses a UTC/IST day boundary so 1-6 UTC = 1-6 IST here).
    - cron: "30 2-14 * * 1-6"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/sync
        run: |
          # A cold Vercel function start can push the real sync work past the
          # platform's hard 60s limit (confirmed 2026-08-25: one run never
          # finished server-side; retrying immediately after hit an
          # already-warm container and finished in 36s) — retry a couple of
          # times before giving up.
          for attempt in 1 2 3; do
            if curl --fail --show-error --silent \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.SYNC_URL }}"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
